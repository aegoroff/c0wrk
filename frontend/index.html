<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Anti-FOUC: apply the persisted theme before first paint. The body CSS
      uses var(--color-*) which default to One Dark; without this a
      light/custom-theme user would see a dark flash before main.tsx runs.
      Reads the zustand-persist key written by stores/themeStore.ts (shape:
      {"state":{"themeId","themeCss","themeType"},"version":3}). The script is
      external (public/prepaint-theme.js) because the production CSP allows
      script-src 'self' only — it is still a blocking classic script, so it
      executes during HTML parse, before the app CSS applies. main.tsx
      re-applies the theme from the rehydrated store; both passes are
      idempotent.
    -->
    <script src="./prepaint-theme.js"></script>
    <title>c0wrk</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
